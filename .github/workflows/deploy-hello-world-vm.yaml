name: Deploy Hello World Script to EC2 VM

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: EC2 instance ID to target
        required: true
        default: "instance id goes here"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  hello-world-vm-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy hello world shell command to EC2
        run: |
          INSTANCE_ID="${{ inputs.instance_id }}"
          echo "[HELLO_WORLD_DEPLOYMENT_START] Target: EC2, ID: $INSTANCE_ID, Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=$INSTANCE_ID" \
            --parameters '{"commands":["echo hello-from-github-actions > /tmp/hello-from-github-actions.txt","cat /tmp/hello-from-github-actions.txt"]}' \
            --comment "Run hello world script on EC2 via SSM"

          echo "[HELLO_WORLD_DEPLOYMENT_COMPLETE] Hello world command queued for EC2: $INSTANCE_ID"
