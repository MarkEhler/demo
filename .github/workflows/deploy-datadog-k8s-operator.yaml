name: Deploy Datadog to Kubernetes

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'EKS Cluster Name'
        required: false
        default: dti-demo-eks

permissions:
  id-token: write
  contents: read

jobs:
  datadog-k8s-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Ensure kubectl and Helm are available
        run: |
          command -v helm || curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          command -v kubectl || curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Configure kubeconfig from EKS
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name || 'dti-demo-eks' }}"
          aws eks update-kubeconfig --region us-east-1 --name "$CLUSTER_NAME"
          kubectl get nodes

      - name: Deploy Datadog Operator and Agent
        run: |
          helm repo add datadog https://helm.datadoghq.com
          helm repo update
          helm upgrade --install datadog-operator datadog/datadog-operator -n datadog --create-namespace
          kubectl create secret generic datadog-secret -n datadog \
            --from-literal api-key="${DATADOG_API_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f application/deploy/datadog-agent-values.yaml
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}