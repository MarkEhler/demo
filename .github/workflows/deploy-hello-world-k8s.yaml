name: Deploy Hello World Pod to EKS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  hello-world-k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Ensure kubectl is available
        run: |
          command -v kubectl || curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Get EKS credentials
        run: |
          aws eks update-kubeconfig --region us-east-1 --name dti-demo-eks

      - name: Deploy hello world pod
        run: |
          kubectl apply -f application/deploy/hello-world-pod.yaml
          kubectl wait --for=condition=Ready pod/hello-world --timeout=120s
          kubectl get pod hello-world -o wide
