name: Deploy Datadog to EC2 VM

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment name
        required: true
        default: development
        type: string
      instance_id:
        description: EC2 instance ID to install Datadog on
        required: true
        default: i-0123456789abcdef0
        type: string
      datadog_site:
        description: Datadog site to use
        required: true
        default: us5.datadoghq.com
        type: string
      project_name:
        description: Project tag value to apply to the agent
        required: true
        default: dti-demo
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  datadog-ec2-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Validate AWS and Datadog secrets
        shell: bash
        run: |
          set -euo pipefail
          for secret in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION DATADOG_API_KEY; do
            if [ -z "${!secret:-}" ]; then
              echo "Missing required secret: $secret" >&2
              exit 1
            fi
          done
          aws sts get-caller-identity --output table

      - name: Deploy Datadog Agent to EC2
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ inputs.instance_id }}"
          DD_TAGS="environment:${{ inputs.environment }} project:${{ inputs.project_name }} owner:platform-team"

          echo "[DATADOG_DEPLOYMENT_START] Target: EC2, ID: $INSTANCE_ID, Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=$INSTANCE_ID" \
            --parameters "commands=[\"bash -s -- '${{ secrets.DATADOG_API_KEY }}' '${{ inputs.datadog_site }}' '$DD_TAGS' < /tmp/install-datadog-vm.sh\",\"cat /tmp/install-datadog-vm.sh > /tmp/install-datadog-vm.sh\"]" \
            --comment "Install Datadog Agent on EC2"

          echo "[DATADOG_DEPLOYMENT_COMPLETE] Agent install command queued for EC2: $INSTANCE_ID"
        env:
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DD_SITE: ${{ inputs.datadog_site }}
          DD_TAGS: "environment:${{ inputs.environment }} project:${{ inputs.project_name }} owner:platform-team"